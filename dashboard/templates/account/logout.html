<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Out - Student Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-xl border border-gray-200 w-full max-w-md text-center mx-auto">
        <div class="w-16 h-16 bg-red-50 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner border border-red-100">
            🔒
        </div>
        
        <h2 class="text-2xl font-bold text-slate-800 mb-2">Sign Out</h2>
        <p class="text-gray-500 mb-6 text-sm px-2">Are you sure you want to sign out from your account?</p>
        
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-red-200 transition duration-200 flex items-center justify-center space-x-2 text-sm sm:text-base">
                <span>Confirm Sign Out</span>
            </button>
        </form>
        
        <div class="mt-6 pt-4 border-t border-gray-100">
            <a href="{% url 'dashboard' %}" class="text-sm font-medium text-indigo-600 hover:text-indigo-800 transition">
                &larr; Back to Dashboard
            </a>
        </div>
    </div>

</body>
</html>
