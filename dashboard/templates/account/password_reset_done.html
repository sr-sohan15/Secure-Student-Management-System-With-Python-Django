<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Sent - Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 font-sans antialiased flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-6 sm:p-8 md:p-10 rounded-3xl shadow-2xl border border-gray-100 w-full max-w-md text-center mx-auto">
        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl font-bold shadow-inner">
            ✉️
        </div>
        
        <h2 class="text-2xl font-bold text-slate-800 mb-2">Check Your Terminal / Inbox</h2>
        <p class="text-gray-500 text-sm mb-6 px-2">We’ve emailed you instructions for setting your password. Since development mode is active, check your VS Code terminal for the reset link!</p>
        
        <div class="pt-4 border-t border-gray-100">
            <a href="{% url 'student_login' %}" class="w-full inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-indigo-200 transition duration-200 text-sm sm:text-base">
                Return to Sign In
            </a>
        </div>
    </div>

</body>
</html>
