<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 font-sans antialiased flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-6 sm:p-8 md:p-10 rounded-3xl shadow-2xl border border-gray-100 w-full max-w-lg my-8 mx-auto">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl font-bold shadow-inner">
                📝
            </div>
            <h2 class="text-2xl font-bold text-slate-800">Student Registration</h2>
            <p class="text-gray-500 text-sm mt-1 px-2">Create your secure student account.</p>
        </div>

        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            
            {% if form.non_field_errors %}
                <div class="bg-red-50 text-red-600 p-3 rounded-xl text-xs font-semibold text-center border border-red-200">
                    {{ form.non_field_errors.0 }}
                </div>
            {% endif %}

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                {% for field in form %}
                <div class="flex flex-col">
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <span class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</span>
                    {% endif %}
                </div>
                {% endfor %}
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-200 transition duration-200 mt-4 text-sm sm:text-base">
                Register Account
            </button>
        </form>

        <div class="mt-6 text-center border-t border-gray-100 pt-4">
            <p class="text-xs text-gray-500">Already have an account? <a href="{% url 'student_login' %}" class="text-indigo-600 font-bold hover:underline">Sign In here</a></p>
        </div>
    </div>

</body>
</html>
