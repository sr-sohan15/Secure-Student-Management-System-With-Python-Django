<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 font-sans antialiased flex items-center justify-center min-h-screen p-4 sm:p-6">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl p-6 sm:p-8 text-white flex flex-col items-center mx-auto">
        
        <div class="w-16 h-16 bg-indigo-600/20 border border-indigo-500/30 rounded-2xl flex items-center justify-center text-indigo-400 mb-6 shadow-inner text-2xl">
            🎓
        </div>

        <h2 class="text-2xl font-bold tracking-tight text-center mb-1">Student Portal</h2>
        <p class="text-xs text-slate-400 text-center mb-8 px-2">Enter your Student ID to receive login OTP.</p>

        <form method="POST" class="w-full space-y-5">
            {% csrf_token %}
            
            <div class="flex flex-col space-y-1.5">
                <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Student ID</label>
                {{ form.student_id }}
                {% if form.student_id.errors %}
                    <span class="text-rose-500 text-xs mt-1">{{ form.student_id.errors.0 }}</span>
                {% endif %}
            </div>

            <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-center shadow-lg shadow-indigo-600/30 transition duration-200 text-sm sm:text-base">
                Send OTP
            </button>
        </form>

    </div>

</body>
</html>
