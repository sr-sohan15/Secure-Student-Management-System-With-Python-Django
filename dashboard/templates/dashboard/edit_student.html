<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student Information</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased flex items-center justify-center min-h-screen p-4 sm:p-6">

    <div class="w-full max-w-2xl bg-white rounded-3xl shadow-xl border border-gray-200 p-6 sm:p-8 mx-auto">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 pb-4 border-b border-gray-100 gap-3">
            <h3 class="text-lg sm:text-xl font-bold text-slate-800 flex items-center">
                <span class="bg-indigo-100 text-indigo-600 p-2 rounded-lg mr-3 text-sm">✏️</span> 
                Edit Student: {{ student.name }}
            </h3>
            <a href="{% url 'dashboard' %}" class="text-sm font-semibold text-gray-500 hover:text-indigo-600 transition">&larr; Back to Dashboard</a>
        </div>
        
        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                {% for field in form %}
                <div class="flex flex-col">
                    <label class="text-sm font-semibold text-gray-700 mb-2">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <span class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</span>
                    {% endif %}
                </div>
                {% endfor %}
            </div>
            
            <div class="flex flex-col-reverse sm:flex-row justify-end gap-3 sm:space-x-4 pt-4 border-t border-gray-100">
                <a href="{% url 'dashboard' %}" class="w-full sm:w-auto px-6 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-xl transition text-sm text-center">Cancel</a>
                <button type="submit" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl shadow-lg shadow-indigo-200 transition duration-200 text-sm">
                    Update Information
                </button>
            </div>
        </form>
    </div>

</body>
</html>
